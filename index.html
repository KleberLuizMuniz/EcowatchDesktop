
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoWatch - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary-subtle d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4">

                <div class="bg-white rounded-5 p-4 p-sm-5 shadow-sm">

                    <h1 class="h3 fw-bold text-center mb-3">EcoWatch</h1>

                    <div class="row justify-content-center mb-4">
                        <div class="col-7 col-sm-6 text-center">
                            <img src="img/Logo.png" alt="Logo EcoWatch" class="img-fluid">
                        </div>
                    </div>

                    <h2 class="h5 fw-bold text-center mb-3">LOGIN</h2>

                    <form id="formLogin">

                        <div class="mb-3">
                            <label for="email" class="form-label mb-1">Email:</label>
                            <input type="email" class="form-control rounded-0 border-secondary" id="email" name="email" required>
                        </div>

                        <div class="mb-2">
                            <label for="senha" class="form-label mb-1">Senha:</label>
                            <input type="password" class="form-control rounded-0 border-secondary" id="senha" name="senha" required>
                        </div>

                        <div class="text-center mb-4">
                            <a href="#" class="text-decoration-none text-dark small">Esqueci minha senha</a>
                        </div>

                        <div class="row justify-content-center">
                            <div class="col-6 col-sm-5 d-grid">
                                <button type="submit" class="btn btn-secondary text-white fw-semibold rounded-3 py-2 small">
                                    Entrar
                                </button>
                            </div>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const formLogin = document.getElementById('formLogin');
        const emailInput = document.getElementById('email');
        const senhaInput = document.getElementById('senha');

        formLogin.addEventListener('submit', function(event) {
            event.preventDefault();

            if (!formLogin.checkValidity()) {
                formLogin.reportValidity();
                return;
            }

            if (emailInput.value.trim() !== '' && senhaInput.value.trim() !== '') {
                window.location.href = 'monitoramento.html';
            }
        });
    </script>

</body>
</html>
